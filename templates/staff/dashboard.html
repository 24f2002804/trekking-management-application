{% extends "base.html" %}
{% block content %}
<h3>My Dashboard</h3>
<p>Welcome, {{ current_user.full_name }}.</p>

<div class="row mt-4">
    <div class="col-md-4">
        <div class="card text-center p-3">
            <h6>Assigned Treks</h6>
            <h2>{{ assigned_treks | length }}</h2>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center p-3">
            <h6>Total Participants</h6>
            <h2>{{ total_participants }}</h2>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center p-3">
            <h6>Open Treks</h6>
            <h2>{{ open_treks_count }}</h2>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-6">
        <div class="card p-3">
            <h5>Participants per Trek</h5>
            <canvas id="staffChart"></canvas>
        </div>
    </div>
</div>

<div class="mt-4">
    <a href="{{ url_for('staff.my_treks') }}" class="btn btn-outline-primary">View My Treks</a>
    <a href="{{ url_for('staff.profile') }}" class="btn btn-outline-secondary">Edit Profile</a>
</div>


<script>
new Chart(document.getElementById('staffChart'), {
    type: 'bar',
    data: {
        labels: {{ chart_labels | tojson }},
        datasets: [{
            label: 'Participants',
            data: {{ chart_values | tojson }},
            backgroundColor: '#198754'
        }]
    },
    options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
            y: {
                ticks: { stepSize: 1 },
                beginAtZero: true
            }
        }
    }
});
</script>
{% endblock %}
