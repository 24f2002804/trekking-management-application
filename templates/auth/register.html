{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="mb-3">Register</h3>
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="full_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" name="password" id="regPassword" class="form-control" required>
                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('regPassword', this)">Show</button>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <div class="input-group">
                    <input type="password" name="confirm_password" id="regConfirmPassword" class="form-control" required>
                    <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('regConfirmPassword', this)">Show</button>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">I am a</label>
                <select name="role" class="form-select" required>
                    <option value="">-- Select Role --</option>
                    <option value="trekker">User (Trekker)</option>
                    <option value="staff">Trek Staff</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <p class="mt-3">Already have an account?
            <a href="{{ url_for('auth.login') }}">Login here</a>
        </p>
    </div>
</div>
<script>
function togglePassword(fieldId, btn) {
    const field = document.getElementById(fieldId);
    if (field.type === "password") {
        field.type = "text";
        btn.textContent = "Hide";
    } else {
        field.type = "password";
        btn.textContent = "Show";
    }
}
</script>
{% endblock %}
