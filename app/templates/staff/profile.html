{% extends "base.html" %}
{% block content %}
<h3>My Profile</h3>

<form method="POST" class="col-md-5">
    <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" value="{{ current_user.full_name }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
        <div class="form-text">Email cannot be changed.</div>
    </div>
    <div class="mb-3">
        <label class="form-label">Contact Number</label>
        <input type="text" name="contact_number" class="form-control" value="{{ staff_profile.contact_number or '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Approval Status</label>
        <input type="text" class="form-control" value="{{ staff_profile.status }}" disabled>
    </div>

    <hr class="my-4">
    <h5>Change Password</h5>
    <p class="text-muted" style="font-size: 0.9rem;">Leave these fields blank if you don't want to change your password.</p>

    <div class="mb-3">
        <label class="form-label">Current Password</label>
        <input type="password" name="current_password" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control">
    </div>
    <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
